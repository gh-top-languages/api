version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude: ["@gh-top-languages/*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      exclude: ["gh-top-languages/*"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      workflows:
        patterns: ["gh-top-languages/*"]
